[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "projekt-red-desktop-pet"
version = "4.5.1"
description = "Arknights Projekt Red Desktop Pet with PySide6 transparent window and dynamic actions"
authors = [
    { name = "215meng" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5.0",
    "Pillow>=9.5.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0"
]

[project.scripts]
red-pet = "pet.app:main"

[tool.setuptools.packages.find]
where = ["src"]
